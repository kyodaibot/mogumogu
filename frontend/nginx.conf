# Nginx config for the container setup (installed as conf.d/default.conf, so it
# sits inside the http block of the image's nginx.conf).
# It serves the built Vue app and forwards /api to the Go backend unchanged.

# Do not reveal the Nginx version in headers or error pages.
server_tokens off;

# The path without the query string. $request_uri is what the client sent;
# $uri would be rewritten to /index.html by the SPA fallback.
map $request_uri $path_only {
    "~^(?<p>[^?]*)" $p;
}

# One JSON line per request with only these fields. No query string, cookies,
# Authorization or CSRF headers and no bodies, so they never reach the logs.
log_format json_access escape=json
    '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
    '"method":"$request_method","path":"$path_only",'
    '"status":$status,"duration_s":$request_time}';

server {
    listen 80;
    server_name _;

    access_log /dev/stdout json_access;

    root /usr/share/nginx/html;

    # Bodies up to 1 MB reach the backend, which answers over 64 KB with its
    # JSON 413. Larger ones are rejected here with the same JSON body.
    client_max_body_size 1m;
    error_page 413 @payload_too_large;

    # `always` adds them to error responses too. Locations below must not use
    # add_header, or these would no longer be inherited.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/ {
        # No URI after the address, so the request path is passed unchanged.
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        # Overwrite, never append: the backend trusts this header from Nginx
        # only, so a client-supplied value must not survive.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Built files have content hashes in their names, so they can be cached
    # for a long time. A missing asset is a real 404, not the SPA page.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Always revalidate the page that points at the current assets.
    location = /index.html {
        expires -1;
    }

    # SPA fallback: unknown paths such as /profile load the app, and the Vue
    # router renders the page.
    location / {
        try_files $uri /index.html;
    }

    # For the compose health check; not logged.
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Same body and content type as the backend's 413 (docs/api.md 1.6).
    location @payload_too_large {
        default_type "application/json; charset=utf-8";
        return 413 '{"error":{"code":"payload_too_large","message":"Request body is too large."}}';
    }
}
