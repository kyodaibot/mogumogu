# Production only: Nginx sits behind Caddy, so $remote_addr would be Caddy's
# container address for every request, and the backend's login rate limit
# would treat all users as one. Take the client address from the
# X-Forwarded-For header Caddy sets, but only for requests from the compose
# network (deploy/compose.yaml), never from the internet.
set_real_ip_from 172.30.0.0/24;
real_ip_header X-Forwarded-For;
