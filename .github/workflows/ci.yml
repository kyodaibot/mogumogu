# Checks every push to dev/master and every PR into them. A push to master
# that passes every check is then deployed (the deploy job); nothing else is
# pushed or deployed.
name: CI

on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]

# Read-only token: no job needs to write to the repository. The deploy job
# adds only the right to ask GitHub for an OIDC token.
permissions:
  contents: read

jobs:
  # Same scan as the pre-commit hook, but over the whole history, because the
  # hook can be skipped or not installed.
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (same version as .pre-commit-config.yaml)
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" gitleaks
      # --redact keeps any finding out of the public job log.
      - name: Scan all commits
        run: '"$RUNNER_TEMP/gitleaks" git --redact --verbose .'

  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      # Throwaway server for the integration tests; each test creates and
      # drops its own mogumogu_test_* database on it.
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: mogumogu
          POSTGRES_PASSWORD: ci-only-placeholder
          POSTGRES_DB: mogumogu
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mogumogu -d mogumogu"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgres://mogumogu:ci-only-placeholder@localhost:5432/mogumogu?sslmode=disable
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go vet ./...
      # CI=true makes the integration tests fail instead of skip if the
      # database were missing (see internal/testdb).
      - run: go test -count=1 ./...

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      # The runner is UTC; also run in Tokyo time, like `make test` runs in
      # both zones, to prove dates do not depend on the machine's zone.
      - run: npm test
      - run: TZ=Asia/Tokyo npm test

  # Agent tests with the fake model only: no AWS credentials, no cost.
  ai:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ai
    env:
      UV_VERSION: 0.12.23
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install uv (same version as ai/Dockerfile)
        run: |
          curl -LsSf "https://astral.sh/uv/${UV_VERSION}/install.sh" | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # Fails if uv.lock does not match pyproject.toml.
      - run: uv sync --locked
      - run: uv run pytest -q

  # Builds the images the way compose does (repo root as context). Not pushed.
  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: docker build -f backend/Dockerfile -t mogumogu-backend:ci .
      - run: docker build -f frontend/Dockerfile -t mogumogu-web:ci .
      - run: docker build -f ai/Dockerfile -t mogumogu-ai:ci .

  # Release: the same steps as `make push` and `make deploy` on a laptop, with
  # temporary credentials for the mogumogu-deploy role (infra/main/github.tf)
  # instead of a profile. That role only trusts pushes to master, so pull
  # requests and other branches could not deploy even if this `if` changed.
  # Rolling back stays manual: `make deploy TAG=<older commit>`.
  deploy:
    needs: [secrets, backend, frontend, ai, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    # Native arm64, like the EC2 instance: no emulation (free for public repos).
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    # One deploy at a time. A deploy in progress is never cancelled; if
    # several pushes queue up, only the newest waiting one runs.
    concurrency:
      group: deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Pinned to a commit, since this step handles AWS credentials (v6.3.0).
      # Not setting `environment:` on this job matters: it would change the
      # token's subject and the role would refuse it.
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-1
          # The log is public: hide the account ID, which appears in image
          # names and in the deploy output.
          mask-aws-account-id: true
      - run: make push
      - run: make deploy
      # The site as a visitor sees it, after deploy.sh found every container
      # healthy.
      - name: Check the live site
        run: curl -fsS --retry 5 --retry-delay 5 --retry-all-errors https://mogumogu.teiyou416.ninja/api/health/ready
