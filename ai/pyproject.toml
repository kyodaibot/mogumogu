[project]
name = "mogumogu-ai"
version = "0.1.0"
description = "mogumogu meal assistant: internal AI service"
authors = [
    { name = "teiyou", email = "teiyou416@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "botocore[crt]>=1.43.119",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "langchain-aws>=1.9.1",
    "langchain-core>=1.7.0",
    "langgraph>=1.2.18",
    "pydantic>=2.14.1",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
